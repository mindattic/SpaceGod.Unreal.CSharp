; Resources/Data (asteroids.bytes, ShipModels.json) is staged by the shared SpaceGodRender plugin's Build.cs
; (RuntimeDependencies, NonUFS), where both tracks read it (US-T46).

[/Script/UnrealEd.ProjectPackagingSettings]
; US-T61: the facade loads every SpaceGodRender asset by path (ShaderBinding's M_<Shader>, MPC_SpaceGod, Resources' textures,
; skyboxes and Kenney craft), so nothing references them and the cooker left the whole plugin out: the package drew every
; renderer with the engine's default material (lit, so black under no lights, and without World Position Offset, so the
; asteroid belt's 55 chunks rasterised their raw geometry around the camera as full-screen triangles once the near plane
; dropped under it: ~115 ms of GPU a frame from the battle's end on).
+DirectoriesToAlwaysCook=(Path="/SpaceGodRender")

; US-T72: Content/Capture holds the shipped SpaceGod.capture.json (docs/CAPTURE.md section 4), read from disk as Unity reads
; StreamingAssets, so it is staged as a loose file, not packed into the .pak.
+DirectoriesToAlwaysStageAsNonUFS=(Path="Capture")
